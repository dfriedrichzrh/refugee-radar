name: CI Pipeline & Algorithmic Self-Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Täglicher automatischer Smoke-Test um 06:00 UTC
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Full Telemetry Ingestion, Corridors & Synthetic Scenarios
      run: |
        python3 aegis.py --once

    - name: Validate live_state.json Schema & Scenarios Integrity
      run: |
        python3 -c "import json; data = json.load(open('live_state.json')); assert 'corridors' in data; assert 'scenarios' in data; print('JSON State & Scenarios Validated Successfully!')"
